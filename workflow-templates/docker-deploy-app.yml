name: Build and Deploy Docker App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: Integrosa/.github/.github/workflows/reusable-docker-build.yml@v1
    with:
      organization_name: "integrosa"
      project_name: "$default_branch"  # GitHub replaces this with repo name
    secrets: inherit

  deploy:
    needs: build
    uses: Integrosa/.github/.github/workflows/reusable-compose-deploy-pr.yml@v1
    with:
      app_name: "$default_branch"  # GitHub replaces this with repo name
      # Base image path from the build output; the bump also catches a matching *-migrate line.
      image_path: ${{ needs.build.outputs.docker_image_path }}
      version_tag: ${{ needs.build.outputs.version_tag }}
    secrets:
      iac_token: ${{ secrets.ARGOCD_IAC_UPDATE_TOKEN }}
