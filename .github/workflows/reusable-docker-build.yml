name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      organization_name:
        description: "Organization name for Docker image path (e.g., 'integrosa')"
        required: true
        type: string
      project_name:
        description: "Project/image name (e.g., 'pianorama')"
        required: true
        type: string
      runs_on:
        description: "Runner to use for the build job (GitHub-hosted; homelab runner is gone)"
        required: false
        type: string
        default: "ubuntu-latest"
      tag_prefix:
        description: "Prefix for git tags"
        required: false
        type: string
        default: "v"
      major_pattern:
        description: "Regex pattern for major version bumps"
        required: false
        type: string
        default: "(BREAKING CHANGE:|!:)"
      minor_pattern:
        description: "Regex pattern for minor version bumps"
        required: false
        type: string
        default: "feat:"
      push_git_tag:
        description: "Whether to create and push git tags"
        required: false
        type: boolean
        default: true
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      docker_context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
    outputs:
      version:
        description: "Semantic version without prefix (e.g., '1.2.3')"
        value: ${{ jobs.build.outputs.version }}
      version_tag:
        description: "Version with tag prefix (e.g., 'v1.2.3')"
        value: ${{ jobs.build.outputs.version_tag }}
      docker_image_full:
        description: "Full Docker image reference with version tag"
        value: ${{ jobs.build.outputs.docker_image_full }}
      docker_image_path:
        description: "Base Docker image path without tag"
        value: ${{ jobs.build.outputs.docker_image_path }}
      docker_image_digest:
        description: "Digest of the pushed image (sha256:...), for deploying by digest"
        value: ${{ jobs.build.outputs.docker_image_digest }}

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write  # Required to push tags
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      docker_image_full: ${{ vars.REGISTRY_URL }}/${{ inputs.organization_name }}/${{ inputs.project_name }}:${{ steps.semver.outputs.version_tag }}
      docker_image_path: ${{ vars.REGISTRY_URL }}/${{ inputs.organization_name }}/${{ inputs.project_name }}
      docker_image_digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0  # Required for semantic versioning
        token: ${{ secrets.GITHUB_TOKEN }}  # Enables pushing tags

    - name: Get semantic version
      id: semver
      uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3  # v5.4.0
      with:
        tag_prefix: ${{ inputs.tag_prefix }}
        major_pattern: ${{ inputs.major_pattern }}
        minor_pattern: ${{ inputs.minor_pattern }}
        version_format: "${major}.${minor}.${patch}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

    - name: Login to Scaleway Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        # Mirror the previously working raw login target (host + namespace path).
        registry: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_NAMESPACE }}
        username: ${{ vars.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
      with:
        context: ${{ inputs.docker_context }}
        file: ${{ inputs.dockerfile_path }}
        push: true
        tags: |
          ${{ vars.REGISTRY_URL }}/${{ inputs.organization_name }}/${{ inputs.project_name }}:${{ steps.semver.outputs.version_tag }}
          ${{ vars.REGISTRY_URL }}/${{ inputs.organization_name }}/${{ inputs.project_name }}:latest
        # Expose the release tag to the Dockerfile (`ARG APP_VERSION`) so the
        # app can show which version is deployed. Dockerfiles that do not
        # declare the ARG only get a "build-arg not consumed" warning.
        build-args: |
          APP_VERSION=${{ steps.semver.outputs.version_tag }}
        # GitHub Actions layer cache — cuts paid runner minutes on incremental builds
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create git tag
      if: ${{ inputs.push_git_tag }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ steps.semver.outputs.version_tag }} -m "Release ${{ steps.semver.outputs.version_tag }}"
        git push origin ${{ steps.semver.outputs.version_tag }}
