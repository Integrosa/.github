    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          set -euo pipefail
          # Strict shapes: --set-string splits on "," and "=" and nests on "."; chart_path is a directory of
          # the caller and no segment starts with "-" (Helm would read it as a flag). Repository grammar:
          # distribution/reference. The --set-string arguments go to $RUNNER_TEMP/set-args, one per line,
          # for helm template and helm upgrade alike (tests/helm-deploy-inputs.sh runs this step).
          # Unanchored bodies, anchored where used: ^...$ in bash, \A...\z in jq (Oniguruma's $ also matches
          # before a trailing newline).
          repo_body='[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)+'
          digest_body='sha256:[0-9a-f]{64}'
          name_body='[a-z][a-zA-Z0-9]{0,30}'
          [[ "$NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]] || { echo "namespace is not a DNS label" >&2; exit 1; }
          [[ "$RELEASE" =~ ^[a-z0-9]([-a-z0-9]{0,51}[a-z0-9])?$ ]] || { echo "release is not a valid Helm release name" >&2; exit 1; }
          [[ "$CHART_PATH" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*(/[A-Za-z0-9._][A-Za-z0-9._-]*)*$ && ! "/$CHART_PATH/" =~ /\.\.?/ ]] \
            || { echo "chart_path must be a relative directory inside the repo" >&2; exit 1; }
          [ -f "$CHART_PATH/Chart.yaml" ] || { echo "no Chart.yaml in $CHART_PATH" >&2; exit 1; }
          [[ "$TIMEOUT" =~ ^([1-9]|10)m$ ]] || { echo "timeout must be 1m-10m" >&2; exit 1; }
          if [ -n "$IMAGES" ]; then
            [ -z "$IMAGE_REPOSITORY$IMAGE_DIGEST" ] || { echo "use images or image_repository/image_digest, not both" >&2; exit 1; }
            # One jq program reads exactly one JSON value, validates it and emits the arguments, so they are
            # exactly the validated strings; the error names the entry that failed.
            jq -rn --arg rr "$repo_body" --arg dr "$digest_body" --arg nr "$name_body" '
              def whole($re): type == "string" and test("\\A(" + $re + ")\\z");
              [inputs] | if length != 1 then error("images must be exactly one JSON object") else .[0] end
              | if type != "object" or length < 1 or length > 10 then error("images must be an object with 1-10 entries") else . end
              | to_entries[]
              | if (.key | whole($nr)) | not then error("image name \(.key | tojson) must match ^\($nr)$")
                elif (.value | type) != "object" or (.value | keys) != ["digest", "repository"] then error("image \(.key): exactly repository and digest")
                elif (.value.repository | whole($rr)) | not then error("image \(.key): repository must be a registry path without tag or digest")
                elif (.value.digest | whole($dr)) | not then error("image \(.key): digest must be sha256:<64 hex>")
                else "--set-string", "images.\(.key).repository=\(.value.repository)",
                     "--set-string", "images.\(.key).digest=\(.value.digest)" end' <<<"$IMAGES" > "$RUNNER_TEMP/set-args"
          else
            [[ "$IMAGE_DIGEST" =~ ^($digest_body)$ ]] || { echo "image_digest must be sha256:<64 hex> (or use images)" >&2; exit 1; }
            [[ "$IMAGE_REPOSITORY" =~ ^($repo_body)$ ]] || { echo "image_repository must be a registry path without tag or digest" >&2; exit 1; }
            printf '%s\n' --set-string "image.repository=$IMAGE_REPOSITORY" --set-string "image.digest=$IMAGE_DIGEST" > "$RUNNER_TEMP/set-args"
          fi

      - name: Install Helm v4.3.0 (pinned checksum)
        run: |
          set -euo pipefail
          # sha256 from the v4.3.0 release notes on GitHub and get.helm.sh (2026-10-07).
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          helm version

      - name: Refuse plain Secrets in the chart
        # App secrets travel as SealedSecrets (integrosa_platform ADR 0029): a plain Secret would sit in
        # git in the clear. Best effort before any cluster call, with a clear message: offline rendering
        # can differ from the install (lookup is empty, .Release.IsInstall is true), so the cluster is
        # the real gate (policy tenant-secrets-sealed-only, ADR 0033). The SealedSecret API is declared,
        # so a chart that falls back to a Secret without it renders as it would in the cluster. Counted:
        # every rendered document (crds/ included: a first install creates them unchecked) and every
        # element of an `items` list at any depth (Helm's builder flattens any object with items,
        # recursively: FlattenListVisitor, cli-runtime). A Secret reference inside an object (no
        # apiVersion v1) is not a manifest.
        run: |
          set -euo pipefail
          # yq v4.54.1 (newest stable, 2026-10-08); sha256 from the release's checksums file.
          curl -fsSLo "$RUNNER_TEMP/yq" https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          mapfile -t set_args < "$RUNNER_TEMP/set-args"
          names=$(helm template "$RELEASE" "$CHART_PATH" --namespace "$NAMESPACE" --include-crds \
            --api-versions bitnami.com/v1alpha1 --api-versions bitnami.com/v1alpha1/SealedSecret \
            "${set_args[@]}" \
            | "$RUNNER_TEMP/yq" -N '[., (.. | select(tag == "!!map" and (.items | tag) == "!!seq") | .items[])] | .[]
                | select(tag == "!!map" and .apiVersion == "v1" and .kind == "Secret") | (.metadata.name // "(no name)")')
          if [ -n "$names" ]; then
            echo "::error::the chart renders plain Secret(s): $(paste -sd' ' - <<<"$names"); use a SealedSecret (integrosa_platform ADR 0029, 0033)"
            exit 1
          fi

      - name: Kubeconfig with a fresh OIDC token per use (exec plugin, no token on disk)
        run: |
          set -euo pipefail
          kube="$RUNNER_TEMP/kube"
          mkdir -p "$kube"
          cat > "$kube/token.sh" <<'EOF'
          #!/usr/bin/env bash
          # Prints an ExecCredential with a new GitHub OIDC token (audience integrosa-platform); client-go
          # asks again after expirationTimestamp. Tokens travel through pipes, never argv.
          set -euo pipefail
          tok=$(curl -fsS -H @<(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=integrosa-platform" | jq -r .value)
          printf '%s' "$tok" | jq -Rc '. as $t | split(".")[1] | gsub("-"; "+") | gsub("_"; "/")
            | . + ("=" * ((4 - length % 4) % 4)) | @base64d | fromjson
            | {apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential",
               status: {token: $t, expirationTimestamp: (.exp - 30 | todate)}}'
          EOF
          chmod 0700 "$kube/token.sh"
          # Written directly (not with kubectl config, which stores paths relative to the kubeconfig).
          printf '%s' "$API_CA" | base64 | tr -d '\n' \
            | jq -Rn --arg server "$API_SERVER" --arg cmd "$kube/token.sh" --arg ns "$NAMESPACE" '{
                apiVersion: "v1", kind: "Config", "current-context": "deploy",
                clusters: [{name: "k3s", cluster: {server: $server, "certificate-authority-data": input}}],
                users: [{name: "github", user: {exec: {apiVersion: "client.authentication.k8s.io/v1",
                  command: $cmd, interactiveMode: "Never"}}}],
                contexts: [{name: "deploy", context: {cluster: "k3s", user: "github", namespace: $ns}}]}' \
            > "$kube/config"
          echo "KUBECONFIG=$kube/config" >> "$GITHUB_ENV"

      - name: Who am I (claims only, never the token)
        run: |
          set -euo pipefail
          tok=$("$RUNNER_TEMP/kube/token.sh" | jq -r .status.token)
          echo "::add-mask::$tok"
          printf '%s' "$tok" | cut -d. -f2 | jq -Rr 'gsub("-"; "+") | gsub("_"; "/") | . + ("=" * ((4 - length % 4) % 4))
            | @base64d | fromjson | {repository_owner_id, repository_id, ref, event_name, job_workflow_ref, aud, lifetime_s: (.exp - .iat)}'
          unset tok
          # Diagnostic only (the runner image's kubectl): never blocks the deploy.
          kubectl auth whoami || echo "::warning::kubectl auth whoami failed"

      - name: Deploy (never an older commit than the last deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Runs wait in a queue but may arrive out of order (a slow build, a re-run of an old run). Each
          # deploy records "deploy <sha>" as the revision description; only revisions that succeeded
          # (deployed, superseded) count. A run deploys only a commit that descends from the last one.
          runbook="integrosa_platform docs/runbooks/platform.md, Wdrożenie aplikacji z CI: sytuacje kryzysowe"
          if hist=$(helm history "$RELEASE" --namespace "$NAMESPACE" --max 50 -o json 2>"$RUNNER_TEMP/hist.err"); then
            last=$(printf '%s' "$hist" | jq -r '[.[] | select(.status == "deployed" or .status == "superseded")
              | select(.description | test("^deploy [0-9a-f]{40}$"))] | sort_by(.revision) | last | .description // "" | ltrimstr("deploy ")')
            [ -n "$last" ] || echo "::warning::release $RELEASE has no successful 'deploy <sha>' revision: no order check this time"
          elif grep -q 'release: not found' "$RUNNER_TEMP/hist.err"; then
            last=
          else
            cat "$RUNNER_TEMP/hist.err" >&2; exit 1
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is already deployed (a re-run does not redeploy; see $runbook)"
            exit 0
          fi
          if [ -n "$last" ]; then
            order=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA?per_page=1" --jq .status) \
              || { echo "::error::cannot compare the deployed $last with $GITHUB_SHA: $runbook"; exit 1; }
            case "$order" in
              ahead) ;;
              behind) echo "::warning::$GITHUB_SHA is older than the deployed $last: not deploying"; exit 0 ;;
              *) echo "::error::$GITHUB_SHA and the deployed $last are $order: $runbook"; exit 1 ;;
            esac
          fi
          mapfile -t set_args < "$RUNNER_TEMP/set-args"
          helm upgrade --install "$RELEASE" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            "${set_args[@]}" \
            --description "deploy $GITHUB_SHA" \
            --rollback-on-failure --wait --timeout "$TIMEOUT"
          helm history "$RELEASE" --namespace "$NAMESPACE" --max 3
