name: Reusable Helm deploy (integrosa-platform, GitHub OIDC)

# Deploys a chart from the calling repo to the k3s cluster with a short-lived GitHub OIDC token
# (integrosa_platform ADR 0030): no cluster secret in GitHub. The cluster accepts the token only from
# this file on main of Integrosa/.github (job_workflow_ref), so callers use @main, never a tag or SHA,
# and only for push/workflow_dispatch runs on main of repos the tenant's RoleBinding names.
# The caller job must grant permissions: {id-token: write, contents: read}.
# The API address and CA are fixed here, not inputs: a caller must not be able to send a token the
# cluster accepts to another host. CA rotation (integrosa_platform docs/runbooks/host.md) updates them.
on:
  workflow_call:
    inputs:
      release:
        description: "Helm release name"
        required: true
        type: string
      namespace:
        description: "Tenant namespace"
        required: true
        type: string
      chart_path:
        description: "Chart directory in the calling repo (relative path)"
        required: true
        type: string
      image_repository:
        description: "Image without tag (docker_image_path of reusable-docker-build); one image, or use images"
        required: false
        type: string
        default: ""
      image_digest:
        description: "sha256:... (docker_image_digest of reusable-docker-build); with image_repository"
        required: false
        type: string
        default: ""
      images:
        description: 'Several images: JSON {"<name>": {"repository": "...", "digest": "sha256:..."}}, set as images.<name>.repository and images.<name>.digest; name ^[a-z][a-zA-Z0-9]{0,30}$, 1-10 images'
        required: false
        type: string
        default: ""
      timeout:
        description: "Helm --timeout, 1m-10m: applies to each hook and to the wait separately, in the upgrade and again in a rollback"
        required: false
        type: string
        default: "5m"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Helm's --timeout applies to every operation on its own: each pre/post hook and the wait
    # (pkg/action/upgrade.go, hooks.go @ v4.3.0), and a rollback repeats that (rollin.Timeout = u.Timeout).
    # One pre-upgrade hook, no rollback hooks: at most 4 x timeout. A job killed mid-rollback leaves the
    # release pending, so timeout is capped at 10m and the job allows 4 x 10m plus setup.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    # Two runs must not upgrade the same release at once (Helm refuses: another operation in progress).
    # queue: max keeps every waiting run; the default cancels a pending run (possibly the newer commit)
    # when another one queues (docs.github.com, concurrency; github/docs actions-group-concurrency.md).
    concurrency:
      group: helm-deploy/${{ inputs.namespace }}/${{ inputs.release }}
      cancel-in-progress: false
      queue: max
    env:
      RELEASE: ${{ inputs.release }}
      NAMESPACE: ${{ inputs.namespace }}
      CHART_PATH: ${{ inputs.chart_path }}
      IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      IMAGES: ${{ inputs.images }}
      TIMEOUT: ${{ inputs.timeout }}
      API_SERVER: https://194.163.128.14:6443
      # k3s server CA (CN=k3s-server-ca@1791238499, valid until 2036-11-21; sha256
